<style>
  .social-launcher-stack {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 900;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .social-launcher {
    width: 58px;
    height: 58px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    color: #fff;
    box-shadow: 0 10px 28px #02061755;
    text-decoration: none;
    transition: transform .18s ease, filter .18s ease;
  }
  .social-launcher:hover {
    transform: translateY(-3px);
    filter: brightness(1.06);
  }
  .social-launcher:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 4px;
  }
  .social-launcher svg {
    width: 32px;
    height: 32px;
  }
  .whatsapp-launcher {
    background: #25d366;
  }
  .whatsapp-launcher svg {
    fill: #fff;
  }
  .instagram-launcher {
    background: radial-gradient(circle at 30% 105%, #fdf497 0 12%, #fd5949 36%, #d6249f 62%, #285AEB 90%);
  }
  .instagram-launcher svg {
    fill: none;
    stroke: #fff;
    stroke-width: 2;
  }
  @media (max-width: 480px) {
    .social-launcher-stack {
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      gap: 10px;
    }
    .social-launcher {
      width: 54px;
      height: 54px;
    }
  }
</style>
