<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Rishmora — Crafted for Comfort{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='mobile-fit-10') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block content %}{% endblock %}
  {% if session.get('user_id') %}{% include "_chat_widget.html" %}{% endif %}
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='js/app.js', v='mobile-fit-5') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
